<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filings Analyst</title>
<style>
  :root { --bg:#f6f4ef; --card:#fffdf8; --ink:#1c1d1f; --muted:#6b6a66; --line:#e2ddd2; --accent:#0f5c4d; --soft:#e3efe9; --warn:#9a4b14; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141615; --card:#1c1f1e; --ink:#e8e6e1; --muted:#9a9892; --line:#2e3230; --accent:#6fc2a9; --soft:#1f3530; --warn:#e3a36f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui, -apple-system, sans-serif; }
  main { max-width:900px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font:600 32px/1.1 Georgia, serif; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  select, input[type=text] { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  select { flex:1; min-width:220px; } input[type=text] { flex:1; min-width:240px; }
  button { font:600 14px system-ui; border:0; border-radius:6px; padding:10px 18px; background:var(--accent); color:var(--card); cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--ink); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .progress { display:none; margin-bottom:14px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .ptext { font-size:13px; color:var(--muted); margin-top:4px; }
  .error { color:var(--warn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-top:16px; }
  .card h2 { font:600 19px/1.3 Georgia, serif; margin:0 0 10px; }
  .badges span { display:inline-block; font:600 11px ui-monospace, monospace; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--soft); color:var(--accent); margin:0 6px 6px 0; }
  .answer { white-space:pre-wrap; }
  .cite { font:600 11px ui-monospace, monospace; background:var(--soft); color:var(--accent); padding:1px 5px; border-radius:3px; text-decoration:none; }
  .sources { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px; margin-top:14px; }
  .source { border:1px solid var(--line); border-radius:6px; padding:10px; font-size:13px; text-decoration:none; color:inherit; display:block; }
  .source b { color:var(--accent); } .source p { margin:4px 0 0; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Filings Analyst</h1>
  <p class="sub">Ask questions about an annual report. Answers are retrieved, re-ranked and cited to the page they came from.</p>

  <div class="row">
    <select id="docSelect"></select>
    <input type="file" id="fileInput" accept="application/pdf" hidden>
    <button class="ghost" id="uploadBtn">Upload PDF</button>
  </div>

  <div class="progress" id="progress">
    <div class="bar"><div id="barFill"></div></div>
    <div class="ptext" id="ptext"></div>
  </div>

  <form class="row" id="askForm">
    <input type="text" id="question" placeholder="e.g. What was the total revenue and how many employees are there?" autocomplete="off">
    <button id="askBtn">Ask</button>
  </form>
  <p class="error" id="error"></p>
  <div id="results"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let documents = [];

const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

async function loadDocuments(selectId) {
  documents = await api("/documents");
  $("docSelect").innerHTML = documents.map((d) =>
    `<option value="${d.doc_id}">${escapeHtml(d.name)}${d.status === "ready" ? "" : " (" + d.status + ")"}</option>`).join("");
  if (selectId) $("docSelect").value = selectId;
}

// ---- upload with a polled progress bar ----
$("uploadBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async () => {
  const file = $("fileInput").files[0];
  if (!file) return;
  $("error").textContent = "";
  const form = new FormData();
  form.append("file", file);
  try {
    const doc = await api("/documents", { method: "POST", body: form });
    $("progress").style.display = "block";
    pollStatus(doc.doc_id);
  } catch (e) { $("error").textContent = "Upload failed: " + e.message; }
};

async function pollStatus(docId) {
  const s = await api(`/documents/${docId}/status`);
  const pct = s.total ? Math.round((100 * s.done) / s.total) : 0;
  const label = { queued: "Starting…", reading: "Reading pages", embedding: "Embedding chunks" }[s.stage] || s.stage;
  if (s.status === "error") {
    $("ptext").textContent = "Indexing failed: " + s.error;
    return;
  }
  if (s.status === "ready") {
    $("barFill").style.width = "100%";
    $("ptext").textContent = "Ready - ask a question.";
    await loadDocuments(docId);
    return;
  }
  $("barFill").style.width = (s.stage === "embedding" ? 50 + pct / 2 : pct / 2) + "%";
  $("ptext").textContent = `${label}: ${s.done} / ${s.total}`;
  setTimeout(() => pollStatus(docId), 1000);
}

// ---- ask a question ----
$("askForm").onsubmit = async (e) => {
  e.preventDefault();
  const question = $("question").value.trim();
  if (!question) return;
  $("error").textContent = "";
  $("askBtn").disabled = true;
  $("askBtn").textContent = "Thinking…";
  try {
    const r = await api("/query", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ doc_id: $("docSelect").value, question }),
    });
    renderAnswer(question, r);
  } catch (err) { $("error").textContent = err.message; }
  $("askBtn").disabled = false;
  $("askBtn").textContent = "Ask";
};

function pageLink(r, page) { return r.pdf_url ? `${r.pdf_url}#page=${page}` : null; }

function renderAnswer(question, r) {
  const pageOf = Object.fromEntries(r.citations.map((c) => [c.tag, c.page]));
  // escape, then turn **bold** into <b> and [S1, S2] into clickable page chips
  let html = escapeHtml(r.answer).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  html = html.replace(/\[([^\]]+)\]/g, (m, inner) => {
    const tags = inner.match(/S\d+/g);
    if (!tags) return m;
    return tags.map((t) => {
      const p = pageOf[t];
      if (!p) return "";
      const link = pageLink(r, p);
      return link ? `<a class="cite" href="${link}" target="_blank">p.${p}</a>` : `<span class="cite">p.${p}</span>`;
    }).join(" ");
  });

  const sources = r.citations.map((c) => {
    const link = pageLink(r, c.page);
    const inner = `<b>${c.tag} · page ${c.page}${c.type === "table" ? " · table" : ""}</b><p>${escapeHtml(c.snippet)}</p>`;
    return link ? `<a class="source" href="${link}" target="_blank">${inner}</a>` : `<div class="source">${inner}</div>`;
  }).join("");

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h2>${escapeHtml(question)}</h2>
    <div class="badges"><span>${r.route.replace("_", " ")}</span>${r.sub_questions.map((s) => `<span>${escapeHtml(s)}</span>`).join("")}</div>
    <div class="answer">${html}</div>
    ${sources ? `<div class="sources">${sources}</div>` : ""}
    <p class="muted" id="eval-${r.query_id}">${r.can_evaluate ? "RAGAS: scoring…" : "RAGAS: not scored (out of scope)"}</p>
    <p class="muted">Retrieved pages (after re-ranking): ${r.retrieved.map((x) => x.page).join(", ") || "none"}</p>`;
  $("results").prepend(card);
  if (r.can_evaluate) scoreAnswer(r.query_id);
}

async function scoreAnswer(queryId) {
  const el = $("eval-" + queryId);
  try {
    const s = await api(`/evaluate/${queryId}`, { method: "POST" });
    const fmt = (v) => (typeof v === "number" ? v.toFixed(2) : "–");
    el.textContent = `RAGAS · faithfulness ${fmt(s.faithfulness)} · answer relevancy ${fmt(s.answer_relevancy)} · context precision ${fmt(s.context_precision)}`;
  } catch (e) { el.textContent = "RAGAS: scoring failed (" + e.message + ")"; }
}

loadDocuments();
</script>
</body>
</html>
